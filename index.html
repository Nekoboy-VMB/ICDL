<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký dự thi chứng chỉ ICDL - Quét CCCD</title>
    <!-- Thư viện quét QR chuẩn -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 25px;
        }
        .scanner-section {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #eef2f7;
            border-radius: 8px;
        }
        .btn-action {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn-action:hover {
            opacity: 0.9;
        }
        #btn-file {
            background-color: #17a2b8;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 15px auto;
            display: none;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #0056b3;
            outline: none;
        }
        .btn-submit {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #004085;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ĐĂNG KÝ DỰ THI CHỨNG CHỈ ICDL</h2>
    
    <!-- Khu vực Quét QR CCCD -->
    <div class="scanner-section">
        <p style="margin-top: 0; color: #555;">Chọn cách điền nhanh thông tin từ CCCD:</p>
        <button type="button" id="btn-scan" class="btn-action">📷 Bật Camera quét QR</button>
        
        <!-- Thêm tính năng chọn ảnh có sẵn (cực kỳ hữu ích cho iPhone) -->
        <input type="file" id="qr-input-file" accept="image/*" style="display: none;">
        <button type="button" id="btn-file" class="btn-action" onclick="document.getElementById('qr-input-file').click();">📁 Tải ảnh chụp mã QR lên</button>

        <div id="reader"></div>
    </div>

    <!-- Form điền thông tin -->
    <form id="icdl-form" onsubmit="event.preventDefault(); alert('Đã gửi thông tin đăng ký thành công!');">
        <div class="form-group">
            <label>Số CCCD:</label>
            <input type="text" id="cccd" name="cccd" required placeholder="Nhập hoặc quét tự động">
        </div>

        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Họ và tên thí sinh">
        </div>

        <div class="form-group">
            <label>Ngày sinh:</label>
            <input type="text" id="dob" name="dob" required placeholder="DD/MM/YYYY">
        </div>

        <div class="form-group">
            <label>Giới tính:</label>
            <input type="text" id="gender" name="gender" placeholder="Nam/Nữ">
        </div>

        <div class="form-group">
            <label>Địa chỉ thường trú:</label>
            <input type="text" id="address" name="address" required placeholder="Địa chỉ trên CCCD">
        </div>

        <div class="form-group">
            <label>Chọn Mô đun thi ICDL:</label>
            <select id="module">
                <option value="icdl_base">ICDL Base (Các mô đun cơ bản)</option>
                <option value="word">Computer & Word Processing</option>
                <option value="excel">Spreadsheets (Excel)</option>
                <option value="ppt">Presentation (PowerPoint)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Xác nhận Đăng ký</button>
    </form>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    const scanBtn = document.getElementById("btn-scan");
    const readerDiv = document.getElementById("reader");

    // Hàm xử lý dữ liệu chung khi quét được mã QR
    function handleQRCodeData(decodedText) {
        console.log("Dữ liệu thô từ QR: ", decodedText);
        const parts = decodedText.split("|");

        if (parts.length >= 4) {
            document.getElementById("cccd").value = parts[0] || "";       
            
            let nameIndex = 2;
            let dobIndex = 3;
            let genderIndex = 4;
            let addressIndex = 5;

            if (parts[1] && /^\d{9}$/.test(parts[1])) {
                nameIndex = 3;
                dobIndex = 4;
                genderIndex = 5;
                addressIndex = 6;
            }

            document.getElementById("fullname").value = parts[nameIndex] || "";   
            
            let rawDob = parts[dobIndex] || "";
            if (rawDob.length === 8) {
                let formattedDob = `${rawDob.substring(0,2)}/${rawDob.substring(2,4)}/${rawDob.substring(4,8)}`;
                document.getElementById("dob").value = formattedDob;
            } else {
                document.getElementById("dob").value = rawDob;
            }

            document.getElementById("gender").value = parts[genderIndex] || "";     
            document.getElementById("address").value = parts[addressIndex] || "";    
            
            alert("Đã điền thông tin từ mã QR CCCD thành công!");
        } else {
            alert("Dữ liệu QR không đúng định dạng: " + decodedText);
        }
    }

    // 1. Quét bằng camera
    scanBtn.addEventListener("click", () => {
        readerDiv.style.display = "block";
        scanBtn.style.display = "none"; 

        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                handleQRCodeData(decodedText);
                stopScanner();
            },
            (errorMessage) => {}
        ).catch(err => {
            alert("Không mở được camera. Hãy cấp quyền hoặc dùng tính năng tải ảnh lên!");
            stopScanner();
        });
    });

    function stopScanner() {
        html5QrCode.stop().then(() => {
            readerDiv.style.display = "none";
            scanBtn.style.display = "inline-block";
        }).catch(err => {
            console.log(err);
        });
    }

    // 2. Quét bằng cách chọn ảnh chụp màn hình mã QR (Cực kỳ nhạy trên iPhone)
    const fileInput = document.getElementById('qr-input-file');
    fileInput.addEventListener('change', e => {
        if (e.target.files.length == 0) return;
        const imageFile = e.target.files[0];
        
        html5QrCode.scanFile(imageFile, true)
        .then(decodedText => {
            handleQRCodeData(decodedText);
        })
        .catch(err => {
            alert("Không đọc được mã QR từ ảnh này. Hãy chắc chắn ảnh chụp rõ mã QR trên thẻ CCCD!");
        });
    });
</script>

</body>
</html>
