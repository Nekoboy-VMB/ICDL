<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét QR CCCD</title>
    <!-- Thư viện quét QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
        #reader { width: 400px; margin: 20px auto; }
        #result { margin-top: 20px; font-weight: bold; color: green; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Ứng dụng Quét QR CCCD</h2>
    
    <!-- Nút bấm để kích hoạt camera tránh bị chặn ngầm -->
    <button onclick="startScanner()">Bật Camera Quét</button>

    <!-- Khung chứa camera -->
    <div id="reader"></div>
    <div id="result">Đang chờ quét...</div>

    <script>
        let html5QrCode;

       function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 25,                    // Tăng số khung hình quét mỗi giây lên 25
                qrbox: { width: 220, height: 220 }, // Định nghĩa kích thước khung quét gọn hơn
                aspectRatio: 1.0            // Giữ tỷ lệ khung hình camera ổn định
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                (decodedText, decodedResult) => {
                    // Xử lý khi quét thành công
                    console.log(`Đã quét được: ${decodedText}`);
                    
                    const parts = decodedText.split('|');
                    if (parts.length >= 7) {
                        document.getElementById('result').innerHTML = `
                            Quét thành công!<br>
                            Số CCCD: ${parts[0]}<br>
                            Họ tên: ${parts[2]}<br>
                            Ngày sinh: ${parts[3]}<br>
                            Địa chỉ: ${parts[5]}
                        `;
                    } else {
                        document.getElementById('result').innerText = "Dữ liệu QR không phải chuẩn CCCD!";
                    }

                    html5QrCode.stop().catch(err => console.error("Lỗi dừng camera", err));
                },
                (errorMessage) => {
                    // Bỏ qua lỗi quét liên tục từng khung hình để đỡ nặng log
                }
            ).catch(err => {
                alert("Không thể mở được camera!");
                console.error("Lỗi khởi động camera:", err);
            });
        }
    </script>

</body>
</html>
