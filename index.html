<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký dự thi chứng chỉ ICDL - Quét CCCD</title>
    <!-- Thư viện quét QR chuẩn -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 25px;
        }
        .scanner-section {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #eef2f7;
            border-radius: 8px;
        }
        .btn-action {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 15px auto;
            display: none;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #0056b3;
            outline: none;
        }
        .btn-submit {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .security-note {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ĐĂNG KÝ DỰ THI CHỨNG CHỈ ICDL</h2>
    
    <!-- Khu vực Quét QR CCCD cam kết chuẩn xác thực -->
    <div class="scanner-section">
        <p style="margin-top: 0; color: #333; font-weight: bold;">Xác thực thông tin chính chủ qua CCCD gắn chip:</p>
        <button type="button" id="btn-scan" class="btn-action">📷 Mở Camera quét QR trực tiếp</button>
        <div class="security-note">🔒 Hệ thống yêu cầu quét trực tiếp bằng camera để đảm bảo tính xác thực, không cho phép tải ảnh có sẵn.</div>

        <div id="reader"></div>
    </div>

    <!-- Form điền thông tin tự động khóa hoặc hiển thị -->
    <form id="icdl-form" onsubmit="event.preventDefault(); alert('Đã gửi thông tin đăng ký xác thực thành công!');">
        <div class="form-group">
            <label>Số CCCD:</label>
            <input type="text" id="cccd" name="cccd" required placeholder="Tự động điền khi quét thành công">
        </div>

        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Họ và tên thí sinh">
        </div>

        <div class="form-group">
            <label>Ngày sinh:</label>
            <input type="text" id="dob" name="dob" required placeholder="DD/MM/YYYY">
        </div>

        <div class="form-group">
            <label>Giới tính:</label>
            <input type="text" id="gender" name="gender" placeholder="Nam/Nữ">
        </div>

        <div class="form-group">
            <label>Địa chỉ thường trú:</label>
            <input type="text" id="address" name="address" required placeholder="Địa chỉ trên CCCD">
        </div>

        <div class="form-group">
            <label>Chọn Mô đun thi ICDL:</label>
            <select id="module">
                <option value="icdl_base">ICDL Base (Các mô đun cơ bản)</option>
                <option value="word">Computer & Word Processing</option>
                <option value="excel">Spreadsheets (Excel)</option>
                <option value="ppt">Presentation (PowerPoint)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Xác nhận Đăng ký</button>
    </form>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    const scanBtn = document.getElementById("btn-scan");
    const readerDiv = document.getElementById("reader");

    // Xử lý bóc tách chuẩn xác chuỗi QR của CCCD (hỗ trợ cả thẻ cũ có số CMND lẫn thẻ mới)
    function processQRData(decodedText) {
        console.log("Dữ liệu thô từ CCCD: ", decodedText);
        const parts = decodedText.split("|");

        if (parts.length >= 4) {
            document.getElementById("cccd").value = parts[0] || "";       
            
            let nameIndex = 2;
            let dobIndex = 3;
            let genderIndex = 4;
            let addressIndex = 5;

            // Kiểm tra nếu phần tử [1] là số CMND cũ (9 chữ số)
            if (parts[1] && /^\d{9}$/.test(parts[1])) {
                nameIndex = 3;
                dobIndex = 4;
                genderIndex = 5;
                addressIndex = 6;
            }

            document.getElementById("fullname").value = parts[nameIndex] || "";   
            
            let rawDob = parts[dobIndex] || "";
            if (rawDob.length === 8) {
                document.getElementById("dob").value = `${rawDob.substring(0,2)}/${rawDob.substring(2,4)}/${rawDob.substring(4,8)}`;
            } else {
                document.getElementById("dob").value = rawDob;
            }

            document.getElementById("gender").value = parts[genderIndex] || "";     
            document.getElementById("address").value = parts[addressIndex] || "";    
            
            alert("Xác thực và điền thông tin từ CCCD thành công!");
        } else {
            alert("Mã QR không đúng định dạng CCCD của Bộ Công an!");
        }
    }

    let isScanning = false;
    scanBtn.addEventListener("click", () => {
        if (!isScanning) {
            readerDiv.style.display = "block";
            scanBtn.innerText = "⏹️ Đóng Camera";
            isScanning = true;

            // Cấu hình tối ưu cho iPhone 15: Ép camera sau và tăng độ phân giải thực tế để bắt nét QR siêu nhỏ
            const config = { 
                fps: 15, 
                qrbox: { width: 280, height: 180 },
                aspectRatio: 1.777778
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                (decodedText) => {
                    processQRData(decodedText);
                    closeScanner();
                },
                (errorMessage) => {
                    // Bỏ qua lỗi khung hình quét liên tục để tránh rác console
                }
            ).catch(err => {
                alert("Không thể khởi động camera. Vui lòng kiểm tra quyền truy cập camera trong Cài đặt trình duyệt Safari/Chrome!");
                closeScanner();
            });
        } else {
            closeScanner();
        }
    });

    function closeScanner() {
        html5QrCode.stop().then(() => {
            readerDiv.style.display = "none";
            scanBtn.innerText = "📷 Mở Camera quét QR trực tiếp";
            isScanning = false;
        }).catch(err => {
            readerDiv.style.display = "none";
            scanBtn.innerText = "📷 Mở Camera quét QR trực tiếp";
            isScanning = false;
        });
    }
</script>

</body>
</html>
