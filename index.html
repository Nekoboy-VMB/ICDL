<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét QR CCCD</title>
    <!-- Thư viện quét QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
        #reader { width: 400px; margin: 20px auto; }
        #result { margin-top: 20px; font-weight: bold; color: green; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Ứng dụng Quét QR CCCD</h2>
    
    <!-- Nút bấm để kích hoạt camera tránh bị chặn ngầm -->
    <button onclick="startScanner()">Bật Camera Quét</button>

    <!-- Khung chứa camera -->
    <div id="reader"></div>
    <div id="result">Đang chờ quét...</div>

    <script>
        let html5QrCode;

        function startScanner() {
            const documentElement = document.getElementById('reader');
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, // Ưu tiên dùng camera sau nếu là điện thoại, hoặc webcam máy tính
                {
                    fps: 10,    // Số khung hình quét mỗi giây
                    qrbox: 250  // Kích thước ô vuông quét
                },
                (decodedText, decodedResult) => {
                    // Thành công khi quét được QR
                    console.log(`Code matched = ${decodedText}`, decodedResult);
                    
                    // Tách dữ liệu CCCD theo dấu |
                    const parts = decodedText.split('|');
                    if (parts.length >= 7) {
                        document.getElementById('result').innerHTML = `
                            Quét thành công!<br>
                            Số CCCD: ${parts[0]}<br>
                            Họ tên: ${parts[2]}<br>
                            Ngày sinh: ${parts[3]}<br>
                            Địa chỉ: ${parts[5]}
                        `;
                    } else {
                        document.getElementById('result').innerText = "Dữ liệu QR không phải chuẩn CCCD!";
                    }

                    // Dừng camera sau khi quét xong
                    html5QrCode.stop().catch(err => console.error("Lỗi dừng camera", err));
                },
                (errorMessage) => {
                    // Lỗi trong quá trình quét liên tục (bỏ qua log này để tránh rác console)
                }
            ).catch(err => {
                alert("Không thể mở được camera! Hãy kiểm tra lại quyền truy cập hoặc thiết bị.");
                console.error("Lỗi khởi động camera:", err);
            });
        }
    </script>

</body>
</html>
