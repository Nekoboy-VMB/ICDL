<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký ICDL - Quét CCCD chuẩn xác</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 25px; }
        .scanner-section { text-align: center; margin-bottom: 25px; padding: 15px; background: #eef2f7; border-radius: 8px; }
        .btn-action { background-color: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        video { width: 100%; max-width: 400px; border-radius: 5px; display: none; margin-top: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        .btn-submit { background-color: #0056b3; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ĐĂNG KÝ DỰ THI CHỨNG CHỈ ICDL</h2>
    
    <div class="scanner-section">
        <button type="button" id="btn-scan" class="btn-action">📷 Mở Camera quét mã CCCD</button>
        <!-- Thẻ video để chạy luồng camera gốc -->
        <video id="video" autoplay playsinline></video>
    </div>

    <form id="icdl-form" onsubmit="event.preventDefault(); alert('Đăng ký thành công!');">
        <div class="form-group">
            <label style="color: #d9534f;">Chuỗi QR Thô:</label>
            <textarea id="raw-qr" rows="2" placeholder="Dữ liệu thô sẽ hiện ở đây..."></textarea>
        </div>
        <div class="form-group">
            <label>Số CCCD:</label>
            <input type="text" id="cccd" required placeholder="Số CCCD">
        </div>
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="fullname" required placeholder="Họ và tên">
        </div>
        <div class="form-group">
            <label>Ngày sinh:</label>
            <input type="text" id="dob" required placeholder="DD/MM/YYYY">
        </div>
        <div class="form-group">
            <label>Giới tính:</label>
            <input type="text" id="gender" placeholder="Nam/Nữ">
        </div>
        <div class="form-group">
            <label>Địa chỉ thường trú:</label>
            <input type="text" id="address" required placeholder="Địa chỉ">
        </div>
        <button type="submit" class="btn-submit">Xác nhận Đăng ký</button>
    </form>
</div>

<script>
    const video = document.getElementById('video');
    const scanBtn = document.getElementById('btn-scan');
    let mediaStream = null;
    let scanning = false;

    scanBtn.addEventListener('click', async () => {
        if (!scanning) {
            try {
                // Ép mở camera sau với độ phân giải cao để nhìn rõ mã QR li ti
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                });
            } catch (err) {
                // Fallback nếu máy không nhận exact environment
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                } catch (e) {
                    alert("Không thể mở camera. Vui lòng cấp quyền camera cho trình duyệt!");
                    return;
                }
            }

            video.srcObject = mediaStream;
            video.style.display = 'block';
            scanBtn.innerText = "⏹️ Dừng quét";
            scanning = true;
            requestAnimationFrame(scanQRCode);
        } else {
            stopScan();
        }
    });

    function stopScan() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }
        video.style.display = 'none';
        scanBtn.innerText = "📷 Mở Camera quét mã CCCD";
        scanning = false;
    }

    async function scanQRCode() {
        if (!scanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // Kiểm tra xem trình duyệt có hỗ trợ BarcodeDetector gốc không
            if ('BarcodeDetector' in window) {
                try {
                    const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
                    const results = await barcodeDetector.detect(video);
                    if (results.length > 0) {
                        const rawText = results[0].rawValue;
                        processData(rawText);
                        stopScan();
                        return;
                    }
                } catch (err) {
                    console.error("Lỗi quét ngầm:", err);
                }
            } else {
                alert("Trình duyệt của bạn không hỗ trợ BarcodeDetector gốc. Hãy dùng Chrome trên Android hoặc Safari mới nhất.");
                stopScan();
                return;
            }
        }
        requestAnimationFrame(scanQRCode);
    }

    function processData(decodedText) {
        document.getElementById("raw-qr").value = decodedText;
        const parts = decodedText.split("|");
        if (parts.length >= 4) {
            document.getElementById("cccd").value = parts[0] || "";       
            
            let nameIndex = 2, dobIndex = 3, genderIndex = 4, addressIndex = 5;
            if (parts[1] && /^\d{9}$/.test(parts[1])) {
                nameIndex = 3; dobIndex = 4; genderIndex = 5; addressIndex = 6;
            }

            document.getElementById("fullname").value = parts[nameIndex] || "";   
            let rawDob = parts[dobIndex] || "";
            if (rawDob.length === 8) {
                document.getElementById("dob").value = `${rawDob.substring(0,2)}/${rawDob.substring(2,4)}/${rawDob.substring(4,8)}`;
            } else {
                document.getElementById("dob").value = rawDob;
            }
            document.getElementById("gender").value = parts[genderIndex] || "";     
            document.getElementById("address").value = parts[addressIndex] || "";    
            alert("Đã tự động điền thông tin từ CCCD thành công!");
        } else {
            alert("Đã quét được mã nhưng không đúng định dạng CCCD Bộ Công an!");
        }
    }
</script>

</body>
</html>
