<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký dự thi ICDL - Quét QR CCCD</title>
    <!-- Thư viện quét QR chuẩn -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 25px;
        }
        .scanner-section {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #eef2f7;
            border-radius: 8px;
        }
        #btn-scan {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #btn-scan:hover {
            background-color: #218838;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 15px auto;
            display: none;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        /* CSS TẠO VIỀN XANH KHI QUÉT QR THÀNH CÔNG (Sử dụng biến --qrbox-color) */
        :root {
            --qrbox-color: white; /* Màu viền mặc định */
        }
        
        #reader__scan_region {
            border: 4px solid var(--qrbox-color) !important;
            box-sizing: border-box;
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #0056b3;
            outline: none;
        }
        .btn-submit {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #004085;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ĐĂNG KÝ DỰ THI CHỨNG CHỈ ICDL</h2>
    
    <!-- Khu vực Quét QR CCCD -->
    <div class="scanner-section">
        <p style="margin-top: 0; color: #555;">Đưa mã QR trên thẻ CCCD vào khung hình để quét tự động:</p>
        <button type="button" id="btn-scan">📷 Bắt đầu quét QR CCCD</button>
        <div id="reader"></div>
    </div>

    <!-- Form điền thông tin -->
    <form id="icdl-form" onsubmit="event.preventDefault();">
        <div class="form-group">
            <label>Số CCCD:</label>
            <input type="text" id="cccd" name="cccd" required placeholder="Tự động điền sau khi quét">
        </div>
        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Họ và tên thí sinh">
        </div>
        <div class="form-group">
            <label>Ngày sinh:</label>
            <input type="text" id="dob" name="dob" required placeholder="DD/MM/YYYY">
        </div>
        <div class="form-group">
            <label>Giới tính:</label>
            <input type="text" id="gender" name="gender" placeholder="Nam/Nữ">
        </div>
        <div class="form-group">
            <label>Địa chỉ thường trú:</label>
            <input type="text" id="address" name="address" required placeholder="Địa chỉ trên CCCD">
        </div>
        <div class="form-group">
            <label>Chọn Mô đun thi ICDL:</label>
            <select id="module">
                <option value="icdl_base">ICDL Base (Các mô đun cơ bản)</option>
                <option value="word">Computer & Word Processing</option>
                <option value="excel">Spreadsheets (Excel)</option>
                <option value="ppt">Presentation (PowerPoint)</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Xác nhận Đăng ký</button>
    </form>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    const scanBtn = document.getElementById("btn-scan");
    const readerDiv = document.getElementById("reader");

    // Hàm rung nhẹ điện thoại khi quét thành công (trên Android)
    function triggerVibration() {
        if ("vibrate" in navigator) {
            navigator.vibrate(100); // Rung 100ms
        }
    }

    scanBtn.addEventListener("click", () => {
        readerDiv.style.display = "block";
        scanBtn.style.display = "none";

        // Cấu hình tối ưu: Zoom x2, Khung quét 300x300, FPS 30
        const qrConfig = { 
            fps: 30,
            qrbox: { width: 300, height: 300 },
            aspectRatio: 1.0
        };

        // Cấu hình camera: Zoom x2, Lấy nét liên tục, Ưu tiên camera sau
        const cameraConfig = { 
            facingMode: "environment",
            advanced: [
                { focusMode: "continuous" },
                { zoom: 2.0 } // Yêu cầu zoom camera lên 2.0x
            ]
        };

        html5QrCode.start(
            cameraConfig, 
            qrConfig,
            (decodedText, decodedResult) => {
                // 1. Hiệu ứng thị giác: Đổi màu viền sang XANH LÁ
                document.documentElement.style.setProperty('--qrbox-color', '#28a745'); // Màu xanh thành công
                triggerVibration(); // Rung nhẹ báo hiệu

                console.log("Dữ liệu QR CCCD thô: ", decodedText);
                const parts = decodedText.split("|");

                if (parts.length >= 6) {
                    document.getElementById("cccd").value = parts[0];
                    document.getElementById("fullname").value = parts[2];
                    
                    let rawDob = parts[3];
                    if (rawDob.length === 8) {
                        document.getElementById("dob").value = `${rawDob.substring(0,2)}/${rawDob.substring(2,4)}/${rawDob.substring(4,8)}`;
                    }
                    document.getElementById("gender").value = parts[4];
                    document.getElementById("address").value = parts[5];
                    
                    // Thông báo cho người dùng (có thể thay bằng alert hoặc log console)
                    console.log("Quét mã QR thành công!");

                    // 2. Dừng camera và reset màu viền sau khi quét thành công
                    setTimeout(() => {
                        stopScanner();
                        document.documentElement.style.setProperty('--qrbox-color', 'white'); // Reset màu viền
                    }, 500); // Đợi 0.5s để người dùng thấy hiệu ứng viền xanh

                } else {
                    alert("Mã QR không đúng chuẩn định dạng CCCD gắn chip!");
                    stopScanner();
                }
            },
            (errorMessage) => {
                // Bỏ qua lỗi khung hình trống, đồng thời reset màu viền về trắng nếu không quét được
                if (document.documentElement.style.getPropertyValue('--qrbox-color') !== 'white') {
                     document.documentElement.style.setProperty('--qrbox-color', 'white');
                }
            }
        ).catch(err => {
             alert("Không thể khởi động camera. Vui lòng cấp quyền truy cập camera!");
             stopScanner();
        });
    });

    function stopScanner() {
        html5QrCode.stop().then(() => {
            readerDiv.style.display = "none";
            scanBtn.style.display = "inline-block";
        }).catch(err => {
            console.log("Lỗi tắt camera: ", err);
        });
    }
</script>

</body>
</html>
