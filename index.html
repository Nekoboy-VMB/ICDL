<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký dự thi chứng chỉ ICDL - Quét CCCD</title>
    <!-- Thư viện quét QR chuẩn -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 20px; }
        .scanner-section { text-align: center; margin-bottom: 25px; padding: 20px; background: #eef2f7; border-radius: 8px; }
        .btn-camera {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        input:focus { border-color: #0056b3; outline: none; }
        .btn-submit { background-color: #0056b3; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .note { font-size: 13px; color: #666; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>ĐĂNG KÝ DỰ THI CHỨNG CHỈ ICDL</h2>
    
    <div class="scanner-section">
        <!-- Nút gọi thẳng camera gốc của điện thoại để chụp và quét -->
        <label for="cccd-camera" class="btn-camera">
            📸 Chụp ảnh QR CCCD trực tiếp
        </label>
        <input type="file" id="cccd-camera" accept="image/*" capture="environment" style="display: none;">
        <div class="note">🔒 Bấm vào để mở camera chụp nhanh mã QR, hệ thống sẽ tự động điền form chính xác tuyệt đối!</div>
    </div>

    <form id="icdl-form" onsubmit="event.preventDefault(); alert('Đăng ký thành công!');">
        <div class="form-group">
            <label>Số CCCD:</label>
            <input type="text" id="cccd" name="cccd" required placeholder="Tự động điền khi chụp...">
        </div>

        <div class="form-group">
            <label>Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Họ và tên thí sinh">
        </div>

        <div class="form-group">
            <label>Ngày sinh:</label>
            <input type="text" id="dob" name="dob" required placeholder="DD/MM/YYYY">
        </div>

        <div class="form-group">
            <label>Giới tính:</label>
            <input type="text" id="gender" name="gender" placeholder="Nam/Nữ">
        </div>

        <div class="form-group">
            <label>Địa chỉ thường trú:</label>
            <input type="text" id="address" name="address" required placeholder="Địa chỉ trên CCCD">
        </div>

        <div class="form-group">
            <label>Chọn Mô đun thi ICDL:</label>
            <select id="module">
                <option value="icdl_base">ICDL Base (Các mô đun cơ bản)</option>
                <option value="word">Computer & Word Processing</option>
                <option value="excel">Spreadsheets (Excel)</option>
                <option value="ppt">Presentation (PowerPoint)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Xác nhận Đăng ký</button>
    </form>
</div>

<script>
    const html5QrCode = new Html5Qrcode("temp-scanner", { verbose: false });
    const cameraInput = document.getElementById('cccd-camera');

    cameraInput.addEventListener('change', e => {
        if (e.target.files.length === 0) return;
        const imageFile = e.target.files[0];

        // Hiển thị thông báo đang xử lý
        alert("Đang phân tích ảnh chụp CCCD, vui lòng đợi trong giây lát...");

        // Dùng thư viện quét file ảnh trực tiếp do camera vừa chụp trả về
        Html5Qrcode.scanFile(imageFile, true)
        .then(decodedText => {
            console.log("Dữ liệu thô từ ảnh chụp: ", decodedText);
            const parts = decodedText.split("|");

            if (parts.length >= 4) {
                document.getElementById("cccd").value = parts[0] || "";       
                
                let nameIndex = 2;
                let dobIndex = 3;
                let genderIndex = 4;
                let addressIndex = 5;

                // Kiểm tra nếu có số CMND cũ ở phần tử [1]
                if (parts[1] && /^\d{9}$/.test(parts[1])) {
                    nameIndex = 3;
                    dobIndex = 4;
                    genderIndex = 5;
                    addressIndex = 6;
                }

                document.getElementById("fullname").value = parts[nameIndex] || "";   
                
                let rawDob = parts[dobIndex] || "";
                if (rawDob.length === 8) {
                    document.getElementById("dob").value = `${rawDob.substring(0,2)}/${rawDob.substring(2,4)}/${rawDob.substring(4,8)}`;
                } else {
                    document.getElementById("dob").value = rawDob;
                }

                document.getElementById("gender").value = parts[genderIndex] || "";     
                document.getElementById("address").value = parts[addressIndex] || "";    
                
                alert("Xác thực và điền thông tin tự động thành công!");
            } else {
                alert("Ảnh chụp không đúng định dạng mã QR CCCD!");
            }
        })
        .catch(err => {
            alert("Không đọc được mã QR từ ảnh chụp. Bạn hãy giữ camera ổn định và chụp lại cận cảnh mã QR nhé!");
        });
    });
</script>
<!-- Div ảo phục vụ khởi tạo ngầm -->
<div id="temp-scanner" style="display:none;"></div>

</body>
</html>
